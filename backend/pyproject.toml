[project]
name = "basqasha-backend"
version = "0.1.0"
description = "Basqasha local backend: FastAPI + Huey pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "huey>=3.4.0",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
package = false
